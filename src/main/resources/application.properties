spring.application.name=bluemoon
server.port=8080

# Mặc định dùng H2 lưu ra file ./data để chạy thử không cần cài CSDL; triển khai thật dùng profile "mysql".
spring.datasource.url=jdbc:h2:file:./data/bluemoon;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false
spring.messages.basename=messages
server.servlet.session.timeout=30m

# Tài khoản quản trị tạo ở lần chạy đầu; đặt biến môi trường BLUEMOON_ADMIN_PASSWORD khi triển khai.
bluemoon.quan-tri.ten-dang-nhap=admin
bluemoon.quan-tri.mat-khau=${BLUEMOON_ADMIN_PASSWORD:admin12345}
